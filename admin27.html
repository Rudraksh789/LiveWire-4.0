<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — LiveWire 4.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="LOGO.jpg">
  <link rel="stylesheet" href="styles.css?v=1788548401529">

  <style>
    /* ====== Admin Page Specific Styles ====== */
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      background: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E');
      pointer-events: none;
      z-index: 0;
    }

    /* Login Overlay */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 23, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.4s ease;
    }

    .login-overlay.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .login-card {
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
    }

    .modal-card h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      margin-bottom: 24px;
      color: var(--ink);
    }

    .admin-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 14px;
      margin-bottom: 20px;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .admin-input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(34, 229, 168, 0.15), 0 0 20px -4px rgba(34, 229, 168, 0.2);
    }

    .modal-card .btn-submit {
      width: 100%;
      padding: 14px;
      font-size: 16px;
    }

    /* Dashboard Layout */
    .admin-dashboard {
      flex: 1;
      padding: 48px 32px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .admin-dashboard.is-visible {
      display: block;
      animation: fadeIn 0.5s forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .admin-header h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      margin: 0;
      background: linear-gradient(90deg, #fff, #a3a3a3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .admin-controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .search-box {
      padding: 10px 16px;
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font-family: inherit;
      width: 300px;
      box-sizing: border-box;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--violet);
    }

    /* Table Styles */
    .table-container {
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.3);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }

    .admin-table th,
    .admin-table td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .admin-table th {
      background: var(--surface-2);
      color: var(--ink-mute);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 12px;
      position: sticky;
      top: 0;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .admin-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .tag-event {
      background: rgba(34, 229, 168, 0.1);
      color: var(--green);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .tag-id {
      color: var(--spark);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .empty-state {
      padding: 48px;
      text-align: center;
      color: var(--ink-mute);
    }
  </style>
</head>

<body>
  <!-- Noise Overlay -->
  <div class="noise"></div>

  <!-- Login Overlay -->
  <div class="login-overlay" id="loginOverlay">
    <div class="modal-card"
      style="text-align: center; padding: 48px 40px; max-width: 420px; box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);">
      <h3>Admin Access</h3>
      <form id="loginForm">
        <!-- Hidden username field so the browser password manager knows how to save it -->
        <input type="text" name="username" autocomplete="username" value="livewire_admin" style="width:1px; height:1px; opacity:0; position:absolute; left:-9999px;" tabindex="-1" aria-hidden="true">
        
        <input type="password" id="adminPassword" name="password" placeholder="Enter Password" class="admin-input" autocomplete="current-password" required
          style="text-align: center; letter-spacing: 0.1em;">
        <button type="submit" class="btn-submit" id="btnLogin">Unlock Database</button>
        <span class="error-msg" id="loginError" style="margin-top:16px; display:block;"></span>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="admin-dashboard" id="adminDashboard">
    <div class="admin-header">
      <h2>Registrations Database</h2>
      <div class="admin-controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Search name, school, event...">
        <button class="btn-submit" id="btnExport" style="padding: 10px 20px;">Export to Excel</button>
        <button class="btn-back" id="btnLogout" style="padding: 10px 20px;">Logout</button>
      </div>
    </div>

    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>School Name</th>
            <th>School Email</th>
            <th>Event</th>
            <th>Participant Name</th>
            <th>Class</th>
            <th>Section</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Discord ID</th>
            <th>In-Game ID</th>
            <th id="thActions" style="display:none;">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="10" class="empty-state">Loading data from Firebase...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase Setup -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBE2Qu3N2QZPbdSQKsvTwOeGym_R-3qnHM",
      authDomain: "livewire-2027.firebaseapp.com",
      databaseURL: "https://livewire-2027-default-rtdb.firebaseio.com",
      projectId: "livewire-2027",
      storageBucket: "livewire-2027.firebasestorage.app",
      messagingSenderId: "1085354777077",
      appId: "1:1085354777077:web:775d32b8c561c2862368bc"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      window.firebaseDb = db;
      window.firebaseAuth = auth;
      window.firebaseCollection = collection;
      window.firebaseGetDocs = getDocs;
      window.firebaseDeleteDoc = deleteDoc;
      window.firebaseDoc = doc;
      window.firebaseGetDoc = getDoc;
      window.firebaseUpdateDoc = updateDoc;
      window.firebaseSignIn = signInWithEmailAndPassword;
      window.firebaseOnAuthStateChanged = onAuthStateChanged;
      window.firebaseSignOut = signOut;
      window.firebaseOnSnapshot = onSnapshot;

      // Dispatch event when Firebase is ready
      window.dispatchEvent(new Event('firebaseReady'));
    } catch (e) {
      console.error("Firebase init failed:", e);
    }
  </script>

  <!-- Admin Logic -->
  <script>
    const loginOverlay = document.getElementById('loginOverlay');
    const adminDashboard = document.getElementById('adminDashboard');
    const loginForm = document.getElementById('loginForm');
    const adminPassword = document.getElementById('adminPassword');
    const btnLogin = document.getElementById('btnLogin');
    const loginError = document.getElementById('loginError');
    const btnLogout = document.getElementById('btnLogout');
    const searchInput = document.getElementById('searchInput');
    const btnExport = document.getElementById('btnExport');
    const tableBody = document.getElementById('tableBody');
    const thActions = document.getElementById('thActions');

    let allData = [];
    
    // Note: A dev-only delete role should be added via Firebase custom claims or a Cloud Function later.
    // For now, keeping a single admin role (isDev = true) so delete functionality remains accessible to signed-in admins.
    let isDev = true;

    const EVENT_NAMES = {
      'hackerrank': 'HackerRank',
      'appetite': 'APPetite',
      'sandbox': 'Sandbox Mania',
      'asc-valorant': 'Ascension — Valorant',
      'asc-rocket': 'Ascension — Rocket League',
      'asc-bgmi': 'Ascension — BGMI',
      'drs': 'Dynamic Racing Showdown',
      'paradox': 'Paradox Palette',
      'aperture': 'Aperture Alchemy',
      'fbf': 'Frame by Frame',
      'soundbytes': 'Sound Bytes',
      'aenigma': 'Aenigma Syntax',
      'venture': 'Venture Verse',
      'quiz': 'Quiz Quotient'
    };

    function setupAuth() {
      window.firebaseOnAuthStateChanged(window.firebaseAuth, (user) => {
        if (user) {
          // If we log in with dev@livewire.com, give dev access.
          isDev = user.email === 'dev@livewire.com';
          loginError.textContent = '';
          unlockDashboard();
        } else {
          loginOverlay.classList.remove('is-hidden');
          adminDashboard.classList.remove('is-visible');
        }
      });
    }

    if (window.firebaseAuth) {
      setupAuth();
    } else {
      window.addEventListener('firebaseReady', setupAuth);
    }

    // Login Logic
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pwd = adminPassword.value;
      
      let emailToTry = '';
      if (pwd === 'dev.lab.27') {
        emailToTry = 'dev@livewire.com';
      } else if (pwd === 'wired.lab.27') {
        emailToTry = 'admin@livewire.com';
      } else {
        loginError.textContent = 'Incorrect password.';
        loginError.classList.add('is-visible');
        adminPassword.value = '';
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Signing in...';
      
      window.firebaseSignIn(window.firebaseAuth, emailToTry, pwd)
        .then(() => {
          adminPassword.value = '';
          btnLogin.disabled = false;
          btnLogin.textContent = 'Unlock Database';
        })
        .catch((error) => {
          btnLogin.disabled = false;
          btnLogin.textContent = 'Unlock Database';
          loginError.textContent = 'Login failed. Did you create the accounts in Firebase?';
          loginError.classList.add('is-visible');
          adminPassword.value = '';
        });
    });

    btnLogout.addEventListener('click', () => {
      if (window.firebaseAuth) {
        window.firebaseSignOut(window.firebaseAuth).catch(err => console.error("Logout failed", err));
      }
    });

    function unlockDashboard() {
      loginOverlay.classList.add('is-hidden');
      adminDashboard.classList.add('is-visible');
      if (isDev) thActions.style.display = 'table-cell';
      if (window.firebaseDb) {
        fetchData();
      } else {
        window.addEventListener('firebaseReady', fetchData);
      }
    }

    let unsubscribe = null;

    // Fetch and flatten data
    function fetchData() {
      try {
        if (unsubscribe) unsubscribe();

        unsubscribe = window.firebaseOnSnapshot(window.firebaseCollection(window.firebaseDb, "registrations"), (querySnapshot) => {
          allData = [];

          querySnapshot.forEach((doc) => {
            const id = doc.id;
            const data = doc.data();
            const schoolName = data.school?.name || 'N/A';
            const schoolEmail = data.school?.email || 'N/A';
            const teacherName = data.teacher?.name || 'N/A';
            const teacherPhone = data.teacher?.phone || 'N/A';
            const teacherEmail = data.teacher?.email || 'N/A';

            if (data.events) {
              Object.keys(data.events).forEach(eventId => {
                const participants = data.events[eventId];
                if (Array.isArray(participants)) {
                  participants.forEach((p, index) => {
                    // Only add if participant actually has a name (skip empty ones)
                    if (p.fullName && p.fullName.trim() !== '') {
                      allData.push({
                        docId: id,
                        schoolName: schoolName,
                        schoolEmail: schoolEmail,
                        teacherName: teacherName,
                        teacherPhone: teacherPhone,
                        teacherEmail: teacherEmail,
                        eventId: eventId,
                        pIndex: index,
                        event: EVENT_NAMES[eventId] || eventId,
                        participant: p.fullName,
                        pClass: p.class || '-',
                        section: p.section || '-',
                        phone: p.phone || '-',
                        email: p.email || '-',
                        discordId: p.discordId || '-',
                        inGameId: p.inGameId || '-'
                      });
                    }
                  });
                }
              });
            }
          });

          renderTable(allData);
        }, (error) => {
          console.error("Error fetching data: ", error);
          tableBody.innerHTML = `<tr><td colspan="11" class="error-msg is-visible">Error loading data. Check console.</td></tr>`;
        });
      } catch (error) {
        console.error("Error setting up listener: ", error);
        tableBody.innerHTML = `<tr><td colspan="11" class="error-msg is-visible">Error loading data. Check console.</td></tr>`;
      }
    }

    // Render Table
    function renderTable(data) {
      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="11" class="empty-state">No registrations found.</td></tr>`;
        return;
      }

      tableBody.innerHTML = data.map(row => `
        <tr>
          <td><strong>${row.schoolName}</strong></td>
          <td>${row.schoolEmail}</td>
          <td><span class="tag-event">${row.event}</span></td>
          <td>${row.participant}</td>
          <td>${row.pClass}</td>
          <td>${row.section}</td>
          <td>${row.phone}</td>
          <td>${row.email}</td>
          <td>${row.discordId}</td>
          <td>${row.inGameId}</td>
          ${isDev ? `<td><button class="btn-back" onclick="deleteReg('${row.docId}', '${row.eventId}', ${row.pIndex})" style="color:var(--spark); border-color:var(--spark); padding:6px 12px; font-size:10px;">Delete</button></td>` : ''}
        </tr>
      `).join('');
    }

    // Delete Registration (Single Participant)
    window.deleteReg = async function (docId, eventId, pIndex) {
      if (!confirm("Are you sure you want to delete this specific participant?")) return;

      try {
        const docRef = window.firebaseDoc(window.firebaseDb, "registrations", docId);
        const docSnap = await window.firebaseGetDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          const events = data.events || {};

          if (events[eventId] && events[eventId][pIndex]) {
            // We blank out the slot instead of using splice() to preserve array indices,
            // because the frontend relies on strict array positions (e.g. participant 1 is index 0).
            events[eventId][pIndex] = { fullName: "", class: "", section: "", phone: "", email: "", discordId: "", inGameId: "" };
            await window.firebaseUpdateDoc(docRef, { events: events });
            alert("Participant deleted successfully.");
            // Table reloads automatically via onSnapshot
          } else {
            alert("Participant data not found in document.");
          }
        }
      } catch (error) {
        console.error("Error deleting document:", error);
        alert("Failed to delete. Check console.");
      }
    };

    // Search
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allData.filter(row => {
        return Object.values(row).some(val =>
          String(val).toLowerCase().includes(q)
        );
      });
      renderTable(filtered);
    });

    // Export CSV
    btnExport.addEventListener('click', () => {
      if (allData.length === 0) return alert('No data to export!');

      const headers = ['Doc ID', 'School Name', 'School Email', 'Teacher Name', 'Teacher Phone', 'Teacher Email', 'Event', 'Participant Name', 'Class', 'Section', 'Participant Phone', 'Participant Email', 'Discord ID', 'In Game ID'];
      const csvRows = [];
      csvRows.push(headers.join(','));

      // Use the currently displayed data (so search filters apply to export!)
      const currentData = searchInput.value ? allData.filter(row => Object.values(row).some(val => String(val).toLowerCase().includes(searchInput.value.toLowerCase()))) : allData;

      function sanitizeCsvField(value, forceText = false) {
        let str = String(value || "");
        if (forceText && !str.startsWith("'")) {
          str = "'" + str;
        } else if (/^[=+\-@\t\r]/.test(str)) {
          str = "'" + str;
        }
        return `"${str.replace(/"/g, '""')}"`;
      }

      for (const row of currentData) {
        const values = [
          sanitizeCsvField(row.docId),
          sanitizeCsvField(row.schoolName),
          sanitizeCsvField(row.schoolEmail),
          sanitizeCsvField(row.teacherName),
          sanitizeCsvField(row.teacherPhone, true), // Prevent Excel scientific notation
          sanitizeCsvField(row.teacherEmail),
          sanitizeCsvField(row.event),
          sanitizeCsvField(row.participant),
          sanitizeCsvField(row.pClass),
          sanitizeCsvField(row.section),
          sanitizeCsvField(row.phone, true), // Prevent Excel scientific notation
          sanitizeCsvField(row.email),
          sanitizeCsvField(row.discordId),
          sanitizeCsvField(row.inGameId)
        ];
        csvRows.push(values.join(','));
      }

      const csvString = csvRows.join('\n');
      const blob = new Blob([csvString], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('hidden', '');
      a.setAttribute('href', url);
      a.setAttribute('download', 'LiveWire_Registrations.csv');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
  <script src="script.js?v=1788548401529"></script>
</body>

</html>
